name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: node ops/check-release.ts "$RELEASE_TAG"
      - name: Pack the checked artifact
        run: npm pack --ignore-scripts
      - name: Check the registry version
        id: registry
        run: node ops/check-registry.ts
      - name: Publish the checked artifact with OIDC
        if: steps.registry.outputs.publish == 'true'
        run: npm publish "${{ steps.registry.outputs.tarball }}" --access public --tag "${{ steps.registry.outputs.dist_tag }}" --provenance --ignore-scripts
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARBALL: ${{ steps.registry.outputs.tarball }}
          PRERELEASE: ${{ steps.registry.outputs.prerelease }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$TARBALL" --clobber
            gh release edit "$RELEASE_TAG" --draft=false
          elif [ "$PRERELEASE" = true ]; then
            gh release create "$RELEASE_TAG" "$TARBALL" --verify-tag --title "$RELEASE_TAG" --notes-file CHANGELOG.md --prerelease
          else
            gh release create "$RELEASE_TAG" "$TARBALL" --verify-tag --title "$RELEASE_TAG" --notes-file CHANGELOG.md
          fi
